# Smart Nyumba Pro — Docker Compose
# Spins up: backend API, frontend (nginx), MySQL, (optional) Adminer
#
# Usage:
#   docker compose up -d            # start all
#   docker compose logs -f backend  # tail API logs
#   docker compose down -v          # stop and remove volumes

version: '3.9'

services:

  # ── MySQL 8 ────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: snp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE:      ${DB_NAME:-smartnyumba}
      MYSQL_USER:          ${DB_USER:-snpuser}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [snp_net]

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: snp_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST:  db
      DB_PORT:  "3306"
      PORT:     "3002"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [snp_net]

  # ── Frontend (nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
    container_name: snp_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [snp_net]

  # ── Adminer (DB UI, dev only) ─────────────────────────────
  adminer:
    image: adminer:latest
    container_name: snp_adminer
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:8080"
    networks: [snp_net]
    profiles: ["dev"]   # only starts with: docker compose --profile dev up

volumes:
  db_data:
  uploads:
  logs:

networks:
  snp_net:
    driver: bridge
