name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.smartnyumba.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    # Only run E2E on main branch merges — too slow for every PR
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (Playwright)
        run: cd .. && npm ci

      - name: Install Playwright browsers
        run: cd .. && npx playwright install chromium --with-deps

      - name: Start backend (test)
        run: |
          cd ../backend
          cp .env.example .env
          node server.js &
          sleep 5
        env:
          NODE_ENV: test
          PORT: 3002

      - name: Start frontend dev server
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:3002

      - name: Run E2E tests
        run: cd .. && npx playwright test e2e/critical-path.spec.js
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL:  http://localhost:3002

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
