version: '3.9'

services:
  # ── MySQL 8 ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: snp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME:-smartnyumba}
      MYSQL_USER:          ${DB_USER:-snp_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/migration_v7_enterprise.sql:/docker-entrypoint-initdb.d/03_v7.sql
    ports:
      - "127.0.0.1:3306:3306"   # Bind to localhost only — not publicly exposed
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+03:00
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (for BullMQ / session cache) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: snp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snp_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           3002
      DB_HOST:        mysql
      DB_PORT:        3306
      DB_NAME:        ${DB_NAME:-smartnyumba}
      DB_USER:        ${DB_USER:-snp_user}
      DB_PASSWORD:    ${DB_PASSWORD}
      DB_POOL_LIMIT:  30
      JWT_SECRET:     ${JWT_SECRET}
      REDIS_URL:      redis://:${REDIS_PASSWORD:-}@redis:6379
      FRONTEND_URL:   ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MPESA_ENV:      ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY:    ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE:       ${MPESA_SHORTCODE}
      MPESA_PASSKEY:         ${MPESA_PASSKEY}
      MPESA_CALLBACK_URL:    ${MPESA_CALLBACK_URL}
      AT_USERNAME:    ${AT_USERNAME}
      AT_API_KEY:     ${AT_API_KEY}
      SMTP_HOST:      ${SMTP_HOST}
      SMTP_PORT:      ${SMTP_PORT}
      SMTP_USER:      ${SMTP_USER}
      SMTP_PASS:      ${SMTP_PASS}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx (reverse proxy + static files) ─────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: snp_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/uploads:ro
      - ssl_certs:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  logs_data:
  ssl_certs:

networks:
  default:
    name: snp_network